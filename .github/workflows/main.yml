name: Deploy website

on:
  push:
    branches:
      - main
      - nishant
  workflow_dispatch:

concurrency:
  group: ftp-deploy-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # Must satisfy composer.json ("php": "^8.3"); the hosting account
          # needs to run 8.3+ as well or the app will 500.
          php-version: "8.3"
          coverage: none
          tools: composer

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Remove vendor tests and docs
        run: |
          find vendor -type d \( -iname test -o -iname tests -o -iname docs -o -iname documentation \) -prune -exec rm -rf {} + || true
          find vendor -type f \( -name '*.md' -o -name 'phpunit.xml*' -o -name '.phpunit.result.cache' \) -delete || true

      # Laravel's runtime directories are tracked in git by a .gitignore file
      # alone, and the FTP action only creates directories that contain at
      # least one syncable file. Without this the app cannot compile Blade
      # views or write logs on the server, which surfaces as a blank HTTP 500.
      - name: Ensure writable runtime directories are shipped
        run: |
          for dir in \
            bootstrap/cache \
            storage/app/public \
            storage/app/private \
            storage/framework/cache/data \
            storage/framework/sessions \
            storage/framework/views \
            storage/logs
          do
            mkdir -p "$dir"
            touch "$dir/.keep"
          done

      - name: Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          log-level: minimal
          timeout: 60000
          exclude: |
            .git/**
            .github/**
            .gitattributes
            .editorconfig
            **/node_modules/**
            **/.env
            **/.env.*
            **/tests/**
            phpunit.xml
            **/writable/logs/**
            **/writable/session/**
            **/writable/cache/**
            **/writable/debugbar/**
            **/uploads/**
            **/bugs/**
            **/docs/**
            **/app.zip
            **/*.md
