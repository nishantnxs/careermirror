<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="CareerMirror">
    <defs>
        <!-- Bold letter "C": outer arc, flat cut ends, inner arc punched back out. -->
        <path id="cm-c"
              d="M 59.14 -70.48
                 A 92 92 0 1 0 59.14 70.48
                 L 34.07 40.60
                 A 53 53 0 1 1 34.07 -40.60
                 Z"/>
    </defs>

    <rect width="512" height="512" rx="112" fill="#4f46e5"/>

    <!-- Mirrored, faded and slightly squashed reflection below the mirror line. -->
    <use href="#cm-c" transform="translate(256 356) scale(1 -0.8)" fill="#ffffff" opacity="0.32"/>

    <!-- The mirror line. -->
    <rect x="150" y="268" width="212" height="8" rx="4" fill="#ffffff" opacity="0.9"/>

    <use href="#cm-c" transform="translate(256 168)" fill="#ffffff"/>
</svg>
